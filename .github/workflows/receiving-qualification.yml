name: Receiving qualification

on:
  push:
    branches: [main]
    paths: ['tools/**', 'handoff/report-native-only-r17.8/**', 'feedback/logs/**', 'HANDOFF-MANIFEST.json', '.github/workflows/receiving-qualification.yml']
  pull_request:
    paths: ['tools/**', 'handoff/report-native-only-r17.8/**', 'feedback/logs/**', 'HANDOFF-MANIFEST.json', '.github/workflows/receiving-qualification.yml']

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Bound artifacts, classified facts and separate receiving gates
        run: python tools/verify_handoff.py
      - name: Canonical public catalog freshness
        run: python tools/refresh_understanding_catalog.py --check
      - name: Existing release and metadata probe regressions
        run: |
          python handoff/report-native-only-r17.8/test-release-r01/test_release.py
          python handoff/report-native-only-r17.8/refresh-state-r01/test_check.py
      - name: Exact diagnostic candidate and admission/performance regressions
        run: |
          python handoff/report-native-only-r17.8/verifier-r03/test_verifier.py
          python tools/test_receiving_contract.py
      - name: Generators must reproduce the committed receiving artifacts
        run: git diff --exit-code
